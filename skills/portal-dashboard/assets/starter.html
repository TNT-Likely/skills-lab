<!doctype html>
<!--
  portal-dashboard 起步模板 v2（Clash 面板风文档优先门户）
  · 零外部依赖，file:// 直开可用
  · 接入真实数据：替换下方 <script> 顶部的 DOCS / FAVS0 / TRASH0 / TOOLS / SERVICES / GIT / LINK_BASE / TOOL_BASE
  · 接入真实后端：实现 /api/favs、/api/trash、/api/trash/restore、/api/trash/purge 四个 POST 接口（离线时 api() 会 toast 提示只读）
  · 设计令牌与规范见同目录 SKILL.md；采样记录见 references/measurements.md
-->
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>portal-dashboard · starter</title>
<style>
  :root {
    color-scheme: light;
    --bg:#f9f7fa; --card:#ffffff; --line:#e4e1e6; --soft:#f2f0f3;
    --ink:#1d1d1f; --dim:#8a8a8e; --blue:#0091ff; --blue-soft:#e7f1ff;
    --green:#34c759; --green-soft:#a1f7a1; --amber:#ff9f0a; --red:#ff3b30;
    --shadow:0 1px 3px rgba(20,20,30,.05);
    --r:20px; --r-sm:14px;
  }
  html[data-theme="dark"] {
    color-scheme: dark;
    --bg:#0e0f12; --card:#1a1b20; --line:#2c2e35; --soft:#22242a;
    --ink:#f2f2f7; --dim:#8e8e93; --blue:#0a84ff; --blue-soft:#10233c;
    --green:#30d158; --green-soft:#1f4d2a; --amber:#ff9f0a; --red:#ff453a;
    --shadow:0 1px 3px rgba(0,0,0,.35);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg:#0e0f12; --card:#1a1b20; --line:#2c2e35; --soft:#22242a;
    --ink:#f2f2f7; --dim:#8e8e93; --blue:#0a84ff; --blue-soft:#10233c;
    --green:#30d158; --green-soft:#1f4d2a; --amber:#ff9f0a; --red:#ff453a;
    --shadow:0 1px 3px rgba(0,0,0,.35);
    }
  }
  * { box-sizing:border-box; margin:0; }
  body { font:13px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",system-ui,sans-serif;
    color:var(--ink); background:var(--bg); }
  .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .wrap { max-width:1440px; margin:0 auto; padding:40px 44px 84px; }

  /* header */
  .top { display:flex; align-items:center; gap:18px; flex-wrap:wrap; margin-bottom:28px; }
  .brand { display:flex; align-items:center; gap:12px; }
  .logo { width:42px; height:42px; border-radius:13px; background:var(--blue); color:#fff;
    display:grid; place-items:center; font-weight:800; font-size:15px; letter-spacing:-.5px;
    box-shadow:0 6px 18px rgba(0,145,255,.22); }
  h1 { font-size:28px; font-weight:700; letter-spacing:-.7px; }
  .sub { color:var(--dim); font-size:12.5px; margin-top:2px; }
  .search { margin-left:auto; display:flex; align-items:center; gap:9px; width:380px; max-width:40vw;
    background:var(--card); border:0; border-radius:999px; padding:13px 18px;
    box-shadow:var(--shadow); }
  .search svg { width:16px; height:16px; color:var(--dim); flex:0 0 auto; }
  .search input { border:0; background:transparent; outline:none; width:100%; font:13.5px inherit; color:var(--ink); }
  .search input::placeholder { color:var(--dim); }
  .search:focus-within { box-shadow:0 0 0 3px rgba(0,145,255,.16), var(--shadow); }
  .mode-switch { margin-left:auto; display:flex; gap:2px; background:var(--card); border:0;
    border-radius:999px; padding:3px; box-shadow:var(--shadow); }
  .mode-switch button { width:32px; height:32px; border:0; border-radius:999px; background:transparent;
    color:var(--dim); display:grid; place-items:center; cursor:pointer; transition:background .15s, color .15s; }
  .mode-switch button:hover { color:var(--ink); }
  .mode-switch button.on { background:var(--blue); color:#fff; box-shadow:0 2px 8px rgba(0,145,255,.28); }
  .mode-switch svg { width:16px; height:16px; }

  /* hero 行（参照原版大卡片） */
  .hero-row { display:grid; grid-template-columns:2fr 1fr 1fr; gap:18px; margin-bottom:26px; }
  .hero-mini { position:relative; overflow:hidden; border-radius:22px; padding:15px 22px; min-height:148px;
    background:var(--card); border:0; box-shadow:0 2px 10px rgba(20,20,30,.06);
    display:flex; align-items:center; gap:18px; }
  .hero-content { position:relative; z-index:2; flex:1; min-width:0; display:flex; align-items:center; }
  .hero-text { min-width:0; flex:1; display:flex; flex-direction:column; gap:10px; }
  .pill { display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:4px 11px; font-size:12px;
    background:var(--soft); color:var(--dim); }
  .pill.green { background:#dcfce7; color:#166534; border:1px solid #86efac; }
  .pill.green .dot { background:#16a34a; }
  html[data-theme="dark"] .pill.green { background:#14351f; color:#4ade80; border-color:#1f6b3a; }
  .pill .dot { width:7px; height:7px; border-radius:50%; background:currentColor; }
  .hero-main { display:flex; flex-direction:column; gap:3px; position:relative; z-index:2; }
  .hero-num { font-size:32px; font-weight:700; letter-spacing:-1.2px; font-variant-numeric:tabular-nums; line-height:1.1; }
  .hero-unit { font-size:13px; font-weight:500; color:var(--dim); margin-left:5px; letter-spacing:0; }
  .hero-tags { display:flex; gap:6px; }
  .tag { display:inline-flex; align-items:center; border-radius:999px; padding:2px 9px; font-size:11px; }
  .tag.gray { background:var(--soft); color:var(--dim); }
  .tag.blue { background:var(--blue-soft); color:var(--blue); }
  .hero-meta { display:flex; align-items:baseline; gap:7px; position:relative; z-index:2;
    color:var(--dim); font-size:11.5px; }
  .hero-meta b { font-size:12.5px; font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums; }
  .hero-meta .sep { opacity:.35; }
  .hero-art { position:relative; flex:0 0 42%; align-self:stretch; display:flex; align-items:center;
    justify-content:center; min-width:0; }
  .blob { position:relative; width:220px; height:150px; z-index:0; opacity:.95;
    background:radial-gradient(circle at 38% 32%, #f4f9ff 0%, #e4efff 46%, #d8e9ff 100%);
    border-radius:54% 46% 43% 57% / 58% 44% 56% 42%; }
  .blob::before { content:""; position:absolute; left:-30px; top:26px; width:112px; height:100px;
    background:radial-gradient(circle at 42% 40%, #f7fbff 0%, #e9f3ff 65%, #e0edff 100%);
    border-radius:50% 50% 44% 56% / 56% 44% 56% 44%; opacity:.92; }
  html[data-theme="dark"] .blob { background:radial-gradient(circle at 38% 32%, #16304f 0%, #0d1c30 70%); }
  html[data-theme="dark"] .blob::before { background:radial-gradient(circle at 42% 40%, #142c48 0%, #0e1f34 70%); }
  .blob-btn { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:46px; height:46px;
    border-radius:50%; border:0; cursor:pointer; background:var(--blue); color:#fff; font-size:18px;
    display:grid; place-items:center; box-shadow:0 10px 24px rgba(0,145,255,.32); z-index:3;
    transition:transform .4s ease; }
  .blob-btn:hover { transform:translate(-50%,-50%) scale(1.05); }
  .metric { position:relative; overflow:hidden; border-radius:22px; padding:14px 18px; min-height:148px;
    background:var(--card); border:0; box-shadow:0 2px 10px rgba(20,20,30,.06); }
  html[data-theme="dark"] .hero-mini, html[data-theme="dark"] .metric { box-shadow:0 2px 10px rgba(0,0,0,.35); }
  .metric-top { display:flex; align-items:center; gap:8px; color:var(--dim); font-size:12px; }
  .metric-top .dim { margin-left:auto; }
  .metric-num { font-size:29px; font-weight:700; letter-spacing:-1.2px; margin-top:5px;
    font-variant-numeric:tabular-nums; }
  .metric-num .unit { font-size:13px; font-weight:500; color:var(--dim); margin-left:4px; letter-spacing:0; }
  .spark { position:absolute; left:0; right:0; bottom:0; width:100%; height:62px; color:var(--blue); }

  /* service strip */
  .services { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:0 0 26px; }
  .services .label { color:var(--dim); font-size:11.5px; margin-right:2px; }
  .svc { display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:4px 11px;
    background:var(--card); border:0; box-shadow:var(--shadow); color:var(--dim); font-size:11.5px; cursor:pointer; }
  .svc .dot { width:7px; height:7px; border-radius:50%; background:var(--green); }
  .svc.off .dot { background:#c9c7cc; }
  html[data-theme="dark"] .svc.off .dot { background:#4a4d55; }
  .svc.up { color:var(--ink); background:#f2fbf5; }
  html[data-theme="dark"] .svc.up { background:#12251a; }
  .svc:hover { box-shadow:0 3px 10px rgba(20,20,30,.12); }

  /* toolbar */
  .toolbar { display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:34px; }
  .chips { display:flex; gap:7px; flex-wrap:wrap; }
  .chips button { border:0; background:var(--card); border-radius:999px; font:12.5px inherit;
    padding:5px 14px; color:var(--dim); cursor:pointer; box-shadow:var(--shadow); }
  .chips button.on { background:var(--blue); color:#fff; font-weight:600; box-shadow:0 3px 10px rgba(0,145,255,.24); }
  .chips button .n { opacity:.7; font-size:10.5px; margin-left:4px; }
  .toolbar .right { margin-left:auto; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .toggle { display:flex; align-items:center; gap:8px; color:var(--dim); font-size:12px; cursor:pointer; }
  .switch { width:40px; height:24px; border-radius:999px; border:0; cursor:pointer; background:#d8d5da;
    position:relative; transition:background .15s; flex:0 0 auto; }
  html[data-theme="dark"] .switch { background:#3a3d44; }
  .switch::after { content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%;
    background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.2); transition:transform .15s; }
  .switch.on { background:var(--blue); }
  .switch.on::after { transform:translateX(16px); }
  .viewbtn { border:0; background:var(--card); border-radius:999px; font:12.5px inherit;
    padding:5px 14px; color:var(--dim); cursor:pointer; box-shadow:var(--shadow); }
  .viewbtn.on { background:var(--blue); color:#fff; font-weight:600; box-shadow:0 3px 10px rgba(0,145,255,.24); }
  .viewbtn .n { opacity:.7; font-size:10.5px; margin-left:4px; }
  .card-actions { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:12px;
    z-index:3; border-radius:inherit; background:rgba(255,255,255,.62); backdrop-filter:blur(3px);
    -webkit-backdrop-filter:blur(3px); opacity:0; pointer-events:none; transition:opacity .15s; }
  html[data-theme="dark"] .card-actions { background:rgba(12,13,17,.62); }
  .doc-card:hover .card-actions, .doc-card:focus-within .card-actions { opacity:1; }
  .doc-card { position:relative; }
  .star, .del { width:38px; height:38px; border:0; border-radius:50%; background:var(--card);
    box-shadow:0 4px 14px rgba(20,20,30,.16); display:grid; place-items:center; font-size:15px;
    cursor:pointer; color:var(--dim); pointer-events:auto; transition:color .12s, transform .12s; }
  .star:hover { color:#f5a623; transform:scale(1.06); }
  .star.on { color:#f5a623; }
  .del:hover { color:var(--red); transform:scale(1.06); }
  @media (hover: none) {
    .card-actions { inset:auto; top:10px; right:10px; background:transparent; backdrop-filter:none;
      -webkit-backdrop-filter:none; opacity:1; }
    .star, .del { width:32px; height:32px; font-size:13px; }
  }
  /* ── 弹窗 ── */
  .overlay { position:fixed; inset:0; background:rgba(15,15,20,.42); backdrop-filter:blur(3px);
    -webkit-backdrop-filter:blur(3px); z-index:300; opacity:0; pointer-events:none; transition:opacity .18s; }
  .overlay.on { opacity:1; pointer-events:auto; }
  .modal { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%) scale(.96); width:min(560px,92vw);
    max-height:560px; background:var(--card); border:1px solid var(--line); border-radius:20px;
    box-shadow:0 24px 60px rgba(0,0,0,.25); z-index:301; display:flex; flex-direction:column;
    opacity:0; pointer-events:none; transition:opacity .18s, transform .18s; }
  .modal.on { opacity:1; pointer-events:auto; transform:translate(-50%,-50%) scale(1); }
  .modal-head { display:flex; align-items:baseline; gap:10px; padding:18px 22px 14px;
    border-bottom:1px solid var(--line); }
  .modal-head b { font-size:15.5px; font-weight:700; letter-spacing:-.2px; }
  .modal-head .m-sub { color:var(--dim); font-size:11.5px; }
  .modal-head .m-close { margin-left:auto; border:0; background:var(--soft); border-radius:8px; width:30px;
    height:30px; cursor:pointer; color:var(--dim); font-size:13px; }
  .modal-head .m-close:hover { color:var(--ink); }
  .modal-body { padding:16px 22px 22px; overflow:auto; }
  .m-list { display:flex; flex-direction:column; gap:8px; }
  .m-item { display:flex; align-items:center; gap:10px; background:var(--soft); border-radius:12px;
    padding:10px 12px; }
  .m-main { min-width:0; flex:1; }
  .m-main b { display:block; font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; }
  .m-main span { display:block; color:var(--dim); font-size:11px; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; }
  .m-open { color:var(--blue); text-decoration:none; font-size:12px; flex:0 0 auto; }
  .m-open:hover { text-decoration:underline; }
  .m-unfav, .m-restore { border:0; border-radius:8px; font:12px inherit; padding:5px 12px; cursor:pointer;
    flex:0 0 auto; }
  .m-unfav { background:var(--card); color:var(--dim); }
  .m-unfav:hover { color:var(--red); }
  .m-restore { background:var(--blue); color:#fff; }
  .m-restore:hover { opacity:.88; }
  .m-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:16px; }
  .btn { border:0; border-radius:10px; font:13px inherit; padding:8px 18px; cursor:pointer; }
  .btn.primary { background:var(--blue); color:#fff; }
  .btn.danger { background:var(--red); color:#fff; }
  .btn.ghost { background:var(--soft); color:var(--dim); }
  .btn:hover { opacity:.88; }
  .m-desc { color:var(--dim); font-size:12.5px; line-height:1.6; }

  /* area sections */
  .area { margin-top:46px; }
  .area-head { display:flex; align-items:center; gap:10px; padding-bottom:12px; border-bottom:1px solid var(--line);
    margin-bottom:16px; }
  .area-dot { width:10px; height:10px; border-radius:3px; flex:0 0 auto; }
  .area-head h2 { font-size:20px; font-weight:700; letter-spacing:-.3px; }
  .area-head .n { color:var(--dim); font-size:11.5px; }
  .area-head .link { margin-left:auto; color:var(--blue); text-decoration:none; font-size:11.5px; }
  .area-head .link:hover { text-decoration:underline; }
  .doc-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:18px; }
  .doc-card { display:flex; flex-direction:column; min-height:150px; padding:18px 20px; border-radius:18px;
    background:var(--card); border:0; box-shadow:var(--shadow); text-decoration:none;
    color:var(--ink); transition:transform .14s, border-color .14s; }
  .doc-card:hover { transform:translateY(-2px); box-shadow:0 8px 22px rgba(20,20,30,.08); }
  .doc-top { display:flex; align-items:center; gap:6px; }
  .badge { display:inline-block; border-radius:999px; padding:2px 8px; font-size:10.5px; }
  .badge.green { background:#e7f9ec; color:#1a8f3a; }
  html[data-theme="dark"] .badge.green { background:#123522; color:var(--green); }
  .badge.gray { background:var(--soft); color:var(--dim); }
  .badge.amber { background:#fff4e0; color:#b26a00; }
  html[data-theme="dark"] .badge.amber { background:#3a2a10; color:var(--amber); }
  .badge.blue { background:var(--blue-soft); color:var(--blue); }
  .type { margin-left:auto; font-family:ui-monospace,monospace; font-size:9.5px; color:var(--dim); }
  .doc-title { font-size:15px; font-weight:600; margin-top:12px; line-height:1.4; padding-right:64px; }
  .doc-desc { color:var(--dim); font-size:12px; margin-top:6px; line-height:1.55;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .doc-foot { display:flex; justify-content:space-between; color:var(--dim); font-size:10.5px; margin-top:auto;
    padding-top:12px; }
  .doc-card.index { border:0; box-shadow:none; background:linear-gradient(160deg, var(--card) 30%, var(--blue-soft) 130%); }
  .doc-card.index:hover { transform:none; box-shadow:none; }
  .doc-card.index .doc-title { color:var(--ink); font-weight:600; }

  /* tools */
  .tools { margin-top:54px; }
  .tool-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:18px; }
  .tool-card { display:flex; flex-direction:column; gap:8px; padding:16px 18px; border-radius:18px;
    background:var(--card); border:0; box-shadow:var(--shadow); }
  .tool-card:hover { box-shadow:0 8px 22px rgba(20,20,30,.08); }
  .tool-top { display:flex; align-items:center; gap:8px; }
  .tool-top .avatar { width:30px; height:30px; border-radius:50%; background:var(--blue-soft); color:var(--blue);
    display:grid; place-items:center; font-weight:700; font-size:12px; flex:0 0 auto; }
  .tool-top b { font-size:13px; font-weight:600; }
  .tool-top .tag { margin-left:auto; background:var(--soft); color:var(--dim); border-radius:6px;
    padding:1px 6px; font-size:9.5px; }
  .tool-desc { color:var(--dim); font-size:11.5px; line-height:1.45;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .tool-foot { display:flex; align-items:center; gap:7px; margin-top:auto; }
  .tool-foot code { font-family:ui-monospace,monospace; font-size:10.5px; color:var(--blue);
    background:var(--blue-soft); border-radius:6px; padding:2px 7px; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; }
  .tool-foot .copy { margin-left:auto; border:1px solid var(--line); background:transparent; color:var(--dim);
    border-radius:6px; font-size:10px; padding:1px 7px; cursor:pointer; }
  .tool-foot .open { color:var(--dim); background:none; border:0; cursor:pointer; font-size:13px; padding:0; }
  .tool-foot .open:hover { color:var(--blue); }

  .empty { color:var(--dim); padding:40px 4px; text-align:center; }
  .foot { margin-top:64px; color:var(--dim); font-size:11.5px; border-top:1px solid var(--line); padding-top:16px;
    display:flex; gap:12px; flex-wrap:wrap; }
  .foot .right { margin-left:auto; }

  .toast { position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(8px);
    background:#1d1d1f; color:#fff; padding:10px 18px; border-radius:999px; font-size:12.5px;
    opacity:0; pointer-events:none; transition:opacity .18s, transform .18s; z-index:200; }
  html[data-theme="dark"] .toast { background:#f2f2f7; color:#1d1d1f; }
  .toast.on { opacity:1; transform:translateX(-50%) translateY(0); }

  @media (max-width:900px) {
    .wrap { padding:24px 18px 60px; }
    .search { width:100%; max-width:none; order:3; margin-left:0; }
    .hero-row { grid-template-columns:1fr 1fr; }
    .hero-mini { grid-column:span 2; }
    .toolbar .right { margin-left:0; }
  }
  @media (max-width:680px) {
    .doc-grid, .tool-grid { grid-template-columns:1fr; }
    .hero-row { grid-template-columns:1fr; }
    .hero-mini { grid-column:auto; gap:8px; }
    .hero-art { flex:0 0 38%; }
    .blob { width:140px; height:120px; }
    .blob::before { width:86px; height:76px; left:-22px; top:22px; }
    .blob-btn { width:38px; height:38px; font-size:15px; }
    h1 { font-size:23px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style></head><body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo">PD</div>
      <div><h1>门户仪表盘 · 起步模板</h1><div class="sub" id="sub">演示数据 · 文档优先门户</div></div>
    </div>
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="搜索文档 / 工具…（/ 聚焦）" autocomplete="off">
    </label>
    <div class="mode-switch" id="modeSwitch" role="group" aria-label="主题模式">
      <button data-mode="auto" title="自动（跟随系统）" aria-label="自动">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor" stroke="none"/></svg>

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const state = { q: "", cat: "全部", currentOnly: false };

let TRASH = TRASH0.slice();
let toastTimer = null;

function toast(msg) {
  const el = $("toast"); el.textContent = msg; el.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("on"), 1800);
}
const isIndex = (d) => d.rel === "README.md" || d.rel.endsWith("/README.md");
const rank = (st) => st === "当前" ? 0 : st === "候选" ? 1 : 2;
const badge = (st) => st === "当前" ? "green" : st === "候选" ? "amber" : "gray";

function areaReadme(area) {
  const d = DOCS.find((x) => x.cat === area && isIndex(x));
  return d ? d.rel : null;
}

function renderHero() {
  const areas = new Set(DOCS.map((d) => d.cat)).size;
  const online = SERVICES_KNOWN ? SERVICES.filter((s) => s.up).length : "—";
  $("docsCount").textContent = DOCS.length;
  $("docsN").textContent = DOCS.length + " 篇";
  $("areaCount").textContent = areas;
  $("svcUp").textContent = online;
  $("toolsTotal").textContent = TOOLS.length;
  $("toolsCount").textContent = TOOLS.length + " 个命令";
  $("syncLast").textContent = GIT.last && GIT.last !== "—" ? String(GIT.last).slice(11) : "—";
  $("sub").textContent = `演示门户 · ${DOCS.length} 篇 · ${areas} 区域`;
  $("refreshBtn").onclick = () => {
    const b = $("refreshBtn");
    b.style.transform = "translate(-50%,-50%) rotate(360deg)";
    setTimeout(() => (b.style.transform = "translate(-50%,-50%)"), 420);
    toast(SERVICES_KNOWN ? `状态已刷新 · ${online === "—" ? 0 : online} 服务在线` : "离线版为静态快照，刷新页面更新");
  };
}

function filteredDocs() {
  const q = state.q.trim().toLowerCase();
  return DOCS.filter((d) => {
    if (state.currentOnly && d.st !== "当前") return false;
    if (state.cat !== "全部" && d.cat !== state.cat) return false;
    if (!q) return true;
    return (d.title + " " + d.desc + " " + d.cat + " " + d.search).toLowerCase().includes(q);
  });
}

function docCard(d) {
  const idx = isIndex(d);
  const title = idx ? (d.rel === "README.md" ? "项目文档 · 总览" : d.title + " · 索引") : d.title;
  const type = idx ? "README" : d.rel.endsWith(".html") ? "HTML" : "MD";
  const fav = FAVS.includes(d.rel);
  return `<a class="doc-card ${idx ? "index" : ""}" href="${LINK_BASE}${encodeURI(d.rel)}"
      title="${esc(d.rel)}">
    <div class="card-actions">
      <button class="star ${fav ? "on" : ""}" data-rel="${esc(d.rel)}" title="收藏">${fav ? "★" : "☆"}</button>
      <button class="del" data-rel="${esc(d.rel)}" title="移到垃圾箱">🗑</button>
    </div>
    <div class="doc-top"><span class="badge ${idx ? "blue" : badge(d.st)}">${idx ? "索引" : d.st}</span>
      <span class="type">${type}</span></div>
    <div class="doc-title">${esc(title)}</div>
    <div class="doc-desc">${esc(d.desc || "")}</div>
    <div class="doc-foot"><span>${esc(d.updated || "")}</span><span>${idx ? "区域入口" : "更新"}</span></div>
  </a>`;
}

function renderAreas() {
  const docs = filteredDocs();
  const q = state.q.trim().toLowerCase();
  const byArea = {};
  docs.forEach((d) => (byArea[d.cat] = byArea[d.cat] || []).push(d));
  const cats = AREA_ORDER.filter((c) => byArea[c] && byArea[c].length);
  if (state.cat !== "全部" && !cats.includes(state.cat) && byArea[state.cat]) cats.push(state.cat);

  if (!cats.length) {
    $("areas").innerHTML = `<div class="empty">没有匹配的文档${q ? "：" + esc(q) : ""}</div>`;
    return;
  }
  $("areas").innerHTML = cats.map((cat) => {
    const list = byArea[cat].slice().sort((a, b) =>
      (isIndex(a) - isIndex(b)) || (rank(a.st) - rank(b.st)) || String(b.updated).localeCompare(String(a.updated)));
    const idx = areaReadme(cat);
    const link = idx ? `<a class="link" href="${LINK_BASE}${encodeURI(idx)}">区域索引 →</a>` : "";
    return `<section class="area" data-area="${esc(cat)}">
      <div class="area-head"><span class="area-dot" style="background:${AREA_COLOR[cat] || "var(--dim)"}"></span>
        <h2>${esc(cat)}</h2><span class="n">${list.length} 篇</span>${link}</div>
      <div class="doc-grid">${list.map(docCard).join("")}</div>
    </section>`;
  }).join("");
}

function renderChips() {

  DOCS.forEach((d) => (counts[d.cat] = (counts[d.cat] || 0) + 1));
  const cats = ["全部", ...AREA_ORDER.filter((c) => counts[c])];
  $("chips").innerHTML = cats.map((c) =>
    `<button class="${state.cat === c ? "on" : ""}" data-c="${esc(c)}">${esc(c)}<span class="n">${c === "全部" ? DOCS.length : counts[c]}</span></button>`).join("");
  $("chips").querySelectorAll("button").forEach((b) =>
    b.onclick = () => { state.cat = b.dataset.c; renderChips(); render(); });
  $("favN").textContent = FAVS.length;
  $("trashN").textContent = TRASH.length;
}

async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; }
  } catch (e) {}
  try {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand("copy");
    ta.remove(); return ok;
  } catch (e) { return false; }
}

function renderTools() {
  const q = state.q.trim().toLowerCase();
  const rows = TOOLS.filter((t) => !q || (t.name + t.desc + t.cmd + t.file).toLowerCase().includes(q));
  $("toolsN").textContent = rows.length + " / " + TOOLS.length;
  $("toolsGrid").innerHTML = rows.length ? rows.map((t) => `
    <div class="tool-card">
      <div class="tool-top"><span class="avatar">${esc(t.letter)}</span><b>${esc(t.name)}</b><span class="tag">${esc(t.tag)}</span></div>
      <div class="tool-desc">${esc(t.desc)}</div>
      <div class="tool-foot"><code>${esc(t.cmd)}</code>
        <button class="copy" data-cmd="${esc(t.cmd)}">复制</button>
        <button class="open" data-file="${esc(t.file)}" title="打开源文件">↗</button></div>
    </div>`).join("") : '<div class="empty">没有匹配的工具</div>';
  $("toolsGrid").querySelectorAll(".copy").forEach((b) =>
    b.onclick = async (e) => {
      e.stopPropagation();
      const ok = await copyText(b.dataset.cmd);
      toast(ok ? "已复制：" + b.dataset.cmd : "复制失败，请手动选择命令");
    });
  /* 参照实现用 location.href 同页打开源文件；演示模板用 window.open 避免假路径把页面导航走 */
  $("toolsGrid").querySelectorAll(".open").forEach((b) =>
    b.onclick = (e) => {
      e.stopPropagation();
      const w = window.open(TOOL_BASE + encodeURI(b.dataset.file), "_blank");
      if (!w) toast("浏览器拦截了弹窗（演示环境）");
    });
}

async function api(path, body) {
  try {
    const res = await fetch(path, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(body || {}),
    });
    return await res.json();
  } catch (e) {
    toast("该操作仅在线门户可用（演示数据只读）");
    throw e;
  }
}

function openModal(title, sub, html) {
  $("mTitle").textContent = title;
  $("mSub").textContent = sub || "";
  $("mBody").innerHTML = html;
  $("modal").classList.add("on");
  $("overlay").classList.add("on");
}
function closeModal() {
  $("modal").classList.remove("on");
  $("overlay").classList.remove("on");
}
$("mClose").onclick = closeModal;
$("overlay").onclick = closeModal;
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeModal();
});

function renderFavsModal() {
  const rows = FAVS.map((rel) => DOCS.find((d) => d.rel === rel)).filter(Boolean);
  openModal("⭐ 收藏夹", FAVS.length + " 篇",
    rows.length
      ? `<div class="m-list">` + rows.map((d) => `
        <div class="m-item">

          <button class="m-unfav" data-rel="${esc(d.rel)}">移除</button>
        </div>`).join("") + `</div>`
      : `<div class="empty">还没有收藏（点卡片右上 ☆）</div>`);
  $("mBody").querySelectorAll(".m-unfav").forEach((b) =>
    b.onclick = async () => {
      try {
        FAVS = await api("/api/favs", { rel: b.dataset.rel });
        renderChips();
        renderFavsModal();
      } catch (e) {}
    });
}

function renderTrashModal() {
  openModal("🗑 垃圾箱", TRASH.length + " 项 · 保留 30 天后自动转入归档",
    TRASH.length
      ? `<div class="m-list">` + TRASH.map((t) => {
          const days = Math.floor((Date.now() - new Date(t.deletedAt).getTime()) / 86400000);
          return `<div class="m-item">
            <div class="m-main"><b>${esc(t.rel)}</b><span>${esc(String(t.deletedAt).slice(0, 10))} 删除（${days} 天前） · ${(t.size / 1024).toFixed(1)}KB</span></div>
            <button class="m-restore" data-rel="${esc(t.rel)}">恢复</button>
          </div>`;
        }).join("") + `</div>
        <div class="m-actions">
          <button class="btn ghost" id="mCancel2">关闭</button>
          <button class="btn primary" id="mPurge">过期条目转入归档</button>
        </div>`
      : `<div class="empty">垃圾箱是空的</div>`);
  const cancel = $("mCancel2");
  if (cancel) cancel.onclick = closeModal;
  const purge = $("mPurge");
  if (purge) purge.onclick = async () => {
    try {
      const res = await api("/api/trash/purge", {});
      closeModal();
      toast(`已转档 ${res.moved.length} 项，页面刷新中…`);
      setTimeout(() => location.reload(), 900);
    } catch (e) {}
  };
  $("mBody").querySelectorAll(".m-restore").forEach((b) =>
    b.onclick = async () => {
      try {
        await api("/api/trash/restore", { rel: b.dataset.rel });
        closeModal();
        toast("已恢复，页面刷新中…");
        setTimeout(() => location.reload(), 700);
      } catch (e) {}
    });
}

function confirmDelete(rel) {
  const d = DOCS.find((x) => x.rel === rel);
  openModal("确认删除", "",
    `<p class="m-desc">要把下面这篇移到垃圾箱吗？删除后保留 30 天，之后自动转入归档。</p>
    <div class="m-item" style="margin-top:12px">
      <div class="m-main"><b>${esc(d ? d.title : rel)}</b><span>${esc(rel)}</span></div>
    </div>
    <div class="m-actions">
      <button class="btn ghost" id="mCancel">取消</button>
      <button class="btn danger" id="mConfirm">确认删除</button>
    </div>`);
  $("mCancel").onclick = closeModal;
  $("mConfirm").onclick = async () => {
    try {
      await api("/api/trash", { rel });
      DOCS = DOCS.filter((x) => x.rel !== rel);
      FAVS = FAVS.filter((r) => r !== rel);
      closeModal();
      toast("已移到垃圾箱（保留 30 天）");
      renderChips();
      render();
    } catch (e) {}
  };
}

function render() { renderAreas(); renderTools(); }

$("curToggle").onclick = () => {
  state.currentOnly = !state.currentOnly;
  $("curToggle").classList.toggle("on", state.currentOnly);
  render(); toast(state.currentOnly ? "只显示当前文档" : "显示全部状态");
};
function getMode() { try { return localStorage.getItem("hub-theme-mode") || "auto"; } catch (e) { return "auto"; } }
function setMode(m) {
  if (m === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.dataset.theme = m;
  document.querySelectorAll("#modeSwitch button").forEach((b) => b.classList.toggle("on", b.dataset.mode === m));
  try { localStorage.setItem("hub-theme-mode", m); } catch (e) {}
}
document.querySelectorAll("#modeSwitch button").forEach((b) => b.onclick = () => setMode(b.dataset.mode));
setMode(getMode());

$("q").addEventListener("input", (e) => { state.q = e.target.value; render(); });
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== $("q")) { e.preventDefault(); $("q").focus(); }
});
$("moreTools").onclick = (e) => { e.preventDefault(); toast("演示数据：上方即全部工具"); };
$("favBtn").onclick = () => renderFavsModal();
$("trashBtn").onclick = () => renderTrashModal();

document.addEventListener("click", async (e) => {
  const el = e.target.closest ? e.target.closest(".star, .del") : null;
  if (!el) return;
  if (el.classList.contains("star")) {
    e.preventDefault(); e.stopPropagation();
    try {
      const favs = await api("/api/favs", { rel: el.dataset.rel });
      FAVS = favs;
      renderChips(); render();
    } catch (err) {}
  } else if (el.classList.contains("del")) {
    e.preventDefault(); e.stopPropagation();
    confirmDelete(el.dataset.rel);
  }
});
function renderServices() {
  $("services").innerHTML = '<span class="label">服务</span>' + SERVICES.map((s) =>
    `<span class="svc ${s.up ? "up" : "off"}" data-url="${s.up ? s.url : ""}" title="${s.known ? (s.up ? "在线" : "离线") : "静态预览未探测"}"><span class="dot"></span>${esc(s.name)} :${s.port}</span>`).join("");
  /* 参照实现用 location.href 跳转；演示模板用 window.open 避免假地址把页面导航走 */
  $("services").querySelectorAll(".svc").forEach((el) => {
    el.onclick = () => el.dataset.url ? window.open(el.dataset.url, "_blank")
      : toast(SERVICES_KNOWN ? "其余服务离线" : "静态预览未探测服务状态");
  });
}
function renderFoot() {
  const pending = GIT.pending ? ` · ${GIT.pending} 待提交` : "";
  $("foot").innerHTML = `<span>演示门户 · 静态数据</span>
    <span>上次同步 ${esc(GIT.last)} · ${GIT.files} 文件${pending}</span>
    <span class="right">portal-dashboard · starter</span>`;
}

renderHero(); renderChips(); render(); renderServices(); renderFoot();
</script>
</body></html>
